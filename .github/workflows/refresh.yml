name: Refresh data and publish dashboard

on:
  schedule:
    # Weekdays, twice a day (UTC). 11:17 UTC = 5:17 Chicago (CST) / 8:17 Brasília,
    # 21:17 UTC = 15:17 Chicago / 18:17 Brasília (after the day's PTAX and most releases).
    - cron: "17 11 * * 1-5"
    - cron: "17 21 * * 1-5"
  workflow_dispatch:
    inputs:
      weekly:
        description: "Send the weekly summary email now (test)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch and validate indicators
        id: fetch
        run: |
          set -o pipefail
          python scripts/fetch.py 2>&1 | tee fetch.log || echo "FETCH_FAILED=1" >> "$GITHUB_ENV"

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Data refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - name: Prepare site
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp data/series.json data/summary.json _site/data/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Email update (GitHub issue mentioning the owner, closed immediately)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          WEEKLY: ${{ github.event.inputs.weekly == 'true' && '1' || '0' }}
        run: |
          out=$(python scripts/notify.py)
          echo "$out"
          if [ "$out" = "SEND=1" ]; then
            gh label create dashboard-update --color 1d76db --description "Automated Brazil dashboard email" 2>/dev/null || true
            url=$(gh issue create --title "$(cat notify_title.txt)" --body-file notify.md --label dashboard-update)
            echo "Created $url"
            gh issue close "$url" --reason completed
          fi

      - name: Fail the run if any indicator failed (triggers GitHub's failure email)
        if: env.FETCH_FAILED == '1'
        run: |
          echo "One or more indicators failed; see the fetch step log. Last good data was kept and flagged stale."
          exit 1
